# 单文件部署版：可直接 cp 到 /etc/nginx/conf.d/daone-web.conf
# 仍需在 http { } 中配置 limit_req_zone（见 deploy/nginx-media-proxy-http.conf）
# 并同机运行 Node：PORT=3000 npm start
#
# 安全说明（P1-01）：
# - media-proxy 反代到本地 Node，不再开放 *.aliyuncs.com / *.myqcloud.com
# - 要求 mp_sig 短时签名；Node 侧校验 HMAC、精确桶白名单、50MB、MIME、限流

server {
  listen 80;
  server_name www.daoneai.com;

  root /var/www/daone-web/dist;
  index index.html;

  # === media-proxy（批量下载 / canvas 取像素；规则与 Node 一致）===

  location = /media-proxy {
    limit_except GET { deny all; }

    if ($http_sec_fetch_site = "cross-site") {
      return 403;
    }

    if ($arg_url = "") {
      return 400;
    }

    if ($arg_mp_sig = "") {
      return 401;
    }

    limit_req zone=daone_media_proxy burst=20 nodelay;
    limit_conn daone_media_proxy_conn 8;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;
    proxy_max_temp_file_size 50m;
    proxy_request_buffering off;
  }

  location ~ ^/media-proxy/([^/]+)/(.+)$ {
    if ($http_sec_fetch_site = "cross-site") {
      return 403;
    }

    set $upstream_host $1;
    set $media_proxy_allowed 0;
    if ($upstream_host ~* "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.(oss-[a-z0-9-]+\.aliyuncs\.com|cos\.[a-z0-9-]+\.myqcloud\.com)$") {
      set $media_proxy_allowed 1;
    }
    if ($media_proxy_allowed = 0) {
      return 403;
    }

    if ($arg_mp_sig = "") {
      return 401;
    }

    limit_req zone=daone_media_proxy burst=20 nodelay;
    limit_conn daone_media_proxy_conn 8;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;
    proxy_max_temp_file_size 50m;
    proxy_request_buffering off;
  }

  # === SPA ===

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
