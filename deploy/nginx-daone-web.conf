# 单文件部署版：可直接 cp 到 /etc/nginx/conf.d/daone-web.conf
# 无需 snippets，适合不想拆两个配置文件的环境

server {
  listen 80;
  server_name www.daoneai.com;

  root /var/www/daone-web/dist;
  index index.html;

  # === media-proxy（批量下载 zip）===

  location = /media-proxy {
    limit_except GET { deny all; }

    if ($arg_url = "") {
      return 400;
    }

    set $media_proxy_allowed 0;
    if ($arg_url ~* "^https?://([a-z0-9-]+\.)*aliyuncs\.com(/|$)") {
      set $media_proxy_allowed 1;
    }
    if ($arg_url ~* "^https?://([a-z0-9-]+\.)*myqcloud\.com(/|$)") {
      set $media_proxy_allowed 1;
    }
    if ($media_proxy_allowed = 0) {
      return 403;
    }

    resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
    resolver_timeout 5s;

    proxy_pass $arg_url;
    proxy_ssl_server_name on;
    proxy_set_header User-Agent daone-media-proxy/1.0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location ~ ^/media-proxy/([^/]+)/(.+)$ {
    resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $upstream_host $1;
    set $upstream_path $2;
    set $media_proxy_allowed 0;
    if ($upstream_host ~* "^([a-z0-9-]+\.)*(aliyuncs\.com|myqcloud\.com)$") {
      set $media_proxy_allowed 1;
    }
    if ($media_proxy_allowed = 0) {
      return 403;
    }

    proxy_pass https://$upstream_host/$upstream_path$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name $upstream_host;
    proxy_set_header Host $upstream_host;
    proxy_set_header User-Agent daone-media-proxy/1.0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # === SPA ===

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
