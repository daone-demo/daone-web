# 单文件部署版：可直接 cp 到 /etc/nginx/conf.d/daone-web.conf
# 仍需在 http { } 中配置 limit_req_zone（见 deploy/nginx-media-proxy-http.conf）
# 并同机运行：PORT=3000 MEDIA_PROXY_HMAC_SECRET=... MEDIA_PROXY_TRUST_PROXY=1 npm start

server {
  listen 80;
  server_name www.daoneai.com;

  root /var/www/daone-web/dist;
  index index.html;

  location = /media-proxy/sign {
    limit_except POST { deny all; }

    if ($http_sec_fetch_site = "cross-site") {
      return 403;
    }

    limit_req zone=daone_media_proxy burst=20 nodelay;
    limit_conn daone_media_proxy_conn 8;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location = /media-proxy {
    limit_except GET { deny all; }

    if ($http_sec_fetch_site = "cross-site") {
      return 403;
    }

    if ($arg_url = "") {
      return 400;
    }

    if ($arg_mp_sig = "") {
      return 401;
    }

    limit_req zone=daone_media_proxy burst=20 nodelay;
    limit_conn daone_media_proxy_conn 8;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;
    proxy_max_temp_file_size 50m;
    proxy_request_buffering off;
  }

  location ~ ^/media-proxy/(daone-oss\.oss-accelerate\.aliyuncs\.com|daone-oss\.oss-cn-hangzhou\.aliyuncs\.com)/(.+)$ {
    if ($http_sec_fetch_site = "cross-site") {
      return 403;
    }

    if ($arg_mp_sig = "") {
      return 401;
    }

    limit_req zone=daone_media_proxy burst=20 nodelay;
    limit_conn daone_media_proxy_conn 8;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;
    proxy_max_temp_file_size 50m;
    proxy_request_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
