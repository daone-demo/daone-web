# 示例：www.daoneai.com 静态站点 + SPA + media-proxy（批量下载 zip 依赖此代理）
# 用法：将 root 改为实际 dist 目录，include media-proxy 段后 reload nginx

server {
  listen 80;
  server_name www.daoneai.com;

  root /var/www/daone-web/dist;
  index index.html;

  # === media-proxy 必须放在 try_files 之前 ===
  include /etc/nginx/snippets/daone-media-proxy.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
