# www.daoneai.com 静态站点 + SPA + media-proxy（批量下载 zip 依赖此代理）
#
# 部署步骤（CentOS / 宝塔等）：
# 1. 将 deploy/nginx-media-proxy-http.conf 内容并入 http { }（limit_req_zone）
# 2. cp deploy/nginx-media-proxy.conf /etc/nginx/snippets/daone-media-proxy.conf
# 3. cp deploy/nginx-site.conf /etc/nginx/conf.d/daone-web.conf
# 4. 修改 root 为实际 dist 目录
# 5. 同机启动 Node：cd /var/www/daone-web && PORT=3000 npm start
# 6. nginx -t && systemctl reload nginx
#
# 注意：不要把 nginx-media-proxy.conf 直接放到 conf.d/ 下！
# conf.d 会在 http 上下文加载 *.conf，其中的 location 必须在 server 内。
# media-proxy 反代到 Node（HMAC + 精确桶白名单 + 50MB + MIME + 限流）。

server {
  listen 80;
  server_name www.daoneai.com;

  root /var/www/daone-web/dist;
  index index.html;

  # media-proxy 必须在 try_files / location / 之前
  include /etc/nginx/snippets/daone-media-proxy.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
