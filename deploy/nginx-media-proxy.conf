# media-proxy 片段：只能在 server { } 内 include，不要单独放到 conf.d/*.conf
# 推荐：cp 到 /etc/nginx/snippets/daone-media-proxy.conf
# 在站点 server 中：include /etc/nginx/snippets/daone-media-proxy.conf;
#
# 安全说明（P0）：
# - 仅允许 HTTPS 上游（query 正则强制 https://，path 强制 proxy_pass https://）
# - 响应强制 attachment + sandbox CSP + CORP，阻断 SVG 等主动内容同源执行
# - Nginx 无法可靠按上游 Content-Type 过滤；Node/Vercel 入口额外拒绝主动 MIME
# - 厂商后缀白名单暂保留；精确桶清单确认后再收紧

# Query 风格：/media-proxy?url=https%3A%2F%2F...
location = /media-proxy {
  limit_except GET { deny all; }

  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  if ($arg_url = "") {
    return 400;
  }

  # map 不能写在 server 内，用 if + set 做域名白名单
  set $media_proxy_allowed 0;
  if ($arg_url ~* "^https://([a-z0-9-]+\.)*aliyuncs\.com(/|$)") {
    set $media_proxy_allowed 1;
  }
  if ($arg_url ~* "^https://([a-z0-9-]+\.)*myqcloud\.com(/|$)") {
    set $media_proxy_allowed 1;
  }
  if ($media_proxy_allowed = 0) {
    return 403;
  }

  resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
  resolver_timeout 5s;

  proxy_pass $arg_url;
  proxy_ssl_server_name on;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  proxy_redirect off;
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Content-Disposition;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header X-Content-Type-Options;

  add_header Cache-Control "public, max-age=3600" always;
  add_header Content-Disposition "attachment" always;
  add_header Content-Security-Policy "sandbox; default-src 'none'" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
}

# Path 风格：/media-proxy/<host>/<path>
location ~ ^/media-proxy/([^/]+)/(.+)$ {
  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
  resolver_timeout 5s;

  set $upstream_host $1;
  set $upstream_path $2;
  set $media_proxy_allowed 0;
  if ($upstream_host ~* "^([a-z0-9-]+\.)*(aliyuncs\.com|myqcloud\.com)$") {
    set $media_proxy_allowed 1;
  }
  if ($media_proxy_allowed = 0) {
    return 403;
  }

  proxy_pass https://$upstream_host/$upstream_path$is_args$args;
  proxy_ssl_server_name on;
  proxy_ssl_name $upstream_host;
  proxy_set_header Host $upstream_host;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  proxy_redirect off;
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Content-Disposition;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header X-Content-Type-Options;

  add_header Cache-Control "public, max-age=3600" always;
  add_header Content-Disposition "attachment" always;
  add_header Content-Security-Policy "sandbox; default-src 'none'" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
}
