# media-proxy 片段：只能在 server { } 内 include，不要单独放到 conf.d/*.conf
# 推荐：
#   1) cp deploy/nginx-media-proxy-http.conf 片段内容到 http { }（limit_req_zone）
#   2) cp 本文件到 /etc/nginx/snippets/daone-media-proxy.conf
#   3) 在站点 server 中：include /etc/nginx/snippets/daone-media-proxy.conf;
#   4) 同机运行 Node：PORT=3000 npm start（承载 HMAC / 精确白名单 / 50MB / MIME / 限流）
#
# 安全说明（P1-01）：
# - 不再由 Nginx 直接开放代理到 *.aliyuncs.com / *.myqcloud.com
# - 统一反代到本地 Node media-proxy，与 Vercel/server.mjs 规则一致
# - 前置 limit_req / limit_conn，降低带宽与连接滥用

# Query 风格：/media-proxy?url=...&mp_exp=...&mp_sig=...
location = /media-proxy {
  limit_except GET { deny all; }

  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  if ($arg_url = "") {
    return 400;
  }

  # 无短时签名一律拒绝（完整校验由 Node 完成）
  if ($arg_mp_sig = "") {
    return 401;
  }

  limit_req zone=daone_media_proxy burst=20 nodelay;
  limit_conn daone_media_proxy_conn 8;

  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_buffering on;
  proxy_max_temp_file_size 50m;
  proxy_request_buffering off;
}

# Path 风格：/media-proxy/<host>/<path>?mp_exp=&mp_sig=
location ~ ^/media-proxy/([^/]+)/(.+)$ {
  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  # 仅允许 OSS/COS 桶主机形态进入反代（与 Node isAllowedMediaProxyHostname 对齐）
  set $upstream_host $1;
  set $media_proxy_allowed 0;
  if ($upstream_host ~* "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.(oss-[a-z0-9-]+\.aliyuncs\.com|cos\.[a-z0-9-]+\.myqcloud\.com)$") {
    set $media_proxy_allowed 1;
  }
  if ($media_proxy_allowed = 0) {
    return 403;
  }

  if ($arg_mp_sig = "") {
    return 401;
  }

  limit_req zone=daone_media_proxy burst=20 nodelay;
  limit_conn daone_media_proxy_conn 8;

  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_buffering on;
  proxy_max_temp_file_size 50m;
  proxy_request_buffering off;
}
