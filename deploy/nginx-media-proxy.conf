# dev.daoneai.com 等 nginx 静态部署需增加媒体代理，否则 /media-proxy 会回落到 index.html。
# 将本段放入站点 server { } 内，并放在 SPA try_files 规则之前。

location ~ ^/media-proxy/([^/]+)/(.+)$ {
  resolver 8.8.8.8 114.114.114.114 valid=300s;
  resolver_timeout 5s;

  set $upstream_host $1;
  set $upstream_path $2;

  proxy_pass https://$upstream_host/$upstream_path$is_args$args;
  proxy_ssl_server_name on;
  proxy_ssl_name $upstream_host;
  proxy_set_header Host $upstream_host;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_hide_header Access-Control-Allow-Origin;

  add_header Access-Control-Allow-Origin * always;
  add_header Cache-Control "public, max-age=3600" always;
}
