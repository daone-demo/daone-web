# media-proxy 片段：只能在 server { } 内 include，不要单独放到 conf.d/*.conf
# 推荐：cp 到 /etc/nginx/snippets/daone-media-proxy.conf
# 在站点 server 中：include /etc/nginx/snippets/daone-media-proxy.conf;

# Query 风格：/media-proxy?url=https%3A%2F%2F...
location = /media-proxy {
  limit_except GET { deny all; }

  if ($arg_url = "") {
    return 400;
  }

  # map 不能写在 server 内，用 if + set 做域名白名单
  set $media_proxy_allowed 0;
  if ($arg_url ~* "^https?://[^/]*aliyuncs\.com") {
    set $media_proxy_allowed 1;
  }
  if ($arg_url ~* "^https?://[^/]*myqcloud\.com") {
    set $media_proxy_allowed 1;
  }
  if ($media_proxy_allowed = 0) {
    return 403;
  }

  resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
  resolver_timeout 5s;

  proxy_pass $arg_url;
  proxy_ssl_server_name on;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_hide_header Access-Control-Allow-Origin;

  add_header Access-Control-Allow-Origin * always;
  add_header Cache-Control "public, max-age=3600" always;
}

# Path 风格：/media-proxy/<host>/<path>
location ~ ^/media-proxy/([^/]+)/(.+)$ {
  resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
  resolver_timeout 5s;

  set $upstream_host $1;
  set $upstream_path $2;

  proxy_pass https://$upstream_host/$upstream_path$is_args$args;
  proxy_ssl_server_name on;
  proxy_ssl_name $upstream_host;
  proxy_set_header Host $upstream_host;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_hide_header Access-Control-Allow-Origin;

  add_header Access-Control-Allow-Origin * always;
  add_header Cache-Control "public, max-age=3600" always;
}
