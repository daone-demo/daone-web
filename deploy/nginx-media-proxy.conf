# media-proxy 片段：只能在 server { } 内 include，不要单独放到 conf.d/*.conf
# 推荐：
#   1) cp deploy/nginx-media-proxy-http.conf 片段内容到 http { }（limit_req_zone）
#   2) cp 本文件到 /etc/nginx/snippets/daone-media-proxy.conf
#   3) 在站点 server 中：include /etc/nginx/snippets/daone-media-proxy.conf;
#   4) 同机运行 Node：PORT=3000 MEDIA_PROXY_HMAC_SECRET=... MEDIA_PROXY_TRUST_PROXY=1 npm start
#
# 安全说明（P1-01 v5）：
# - Nginx 不直连对象存储；统一反代 Node
# - /media-proxy/sign 由已登录用户换取短时签名；密钥仅在服务端
# - 取流路径要求 mp_sig，且主机必须是业务精确桶

# 登录态签发短时代理令牌（密钥不进前端）
location = /media-proxy/sign {
  limit_except POST { deny all; }

  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  limit_req zone=daone_media_proxy burst=20 nodelay;
  limit_conn daone_media_proxy_conn 8;

  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  proxy_request_buffering on;
}

# Query 风格：/media-proxy?url=...&mp_exp=...&mp_sig=...
location = /media-proxy {
  limit_except GET { deny all; }

  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  if ($arg_url = "") {
    return 400;
  }

  if ($arg_mp_sig = "") {
    return 401;
  }

  limit_req zone=daone_media_proxy burst=20 nodelay;
  limit_conn daone_media_proxy_conn 8;

  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_buffering on;
  proxy_max_temp_file_size 50m;
  proxy_request_buffering off;
}

# Path 风格：仅业务精确桶主机
location ~ ^/media-proxy/(daone-oss\.oss-accelerate\.aliyuncs\.com|daone-oss\.oss-cn-hangzhou\.aliyuncs\.com)/(.+)$ {
  if ($http_sec_fetch_site = "cross-site") {
    return 403;
  }

  if ($arg_mp_sig = "") {
    return 401;
  }

  limit_req zone=daone_media_proxy burst=20 nodelay;
  limit_conn daone_media_proxy_conn 8;

  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_buffering on;
  proxy_max_temp_file_size 50m;
  proxy_request_buffering off;
}
