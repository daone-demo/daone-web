# www.daoneai.com 等 nginx 静态部署必须增加媒体代理，否则 /media-proxy 会回落到 index.html，
# 批量下载无法 fetch 资源打包 zip，只能逐个直连下载。
# 将本段放入站点 server { } 内，并放在 SPA try_files / location / 之前。

map $arg_url $media_proxy_allowed {
  default 0;
  "~^https?://[^/]*aliyuncs\.com" 1;
  "~^https?://[^/]*myqcloud\.com" 1;
}

# Query 风格：/media-proxy?url=https%3A%2F%2F...
location = /media-proxy {
  limit_except GET { deny all; }

  if ($arg_url = "") {
    return 400;
  }
  if ($media_proxy_allowed = 0) {
    return 403;
  }

  resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
  resolver_timeout 5s;

  proxy_pass $arg_url;
  proxy_ssl_server_name on;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_hide_header Access-Control-Allow-Origin;

  add_header Access-Control-Allow-Origin * always;
  add_header Cache-Control "public, max-age=3600" always;
}

# Path 风格：/media-proxy/<host>/<path>
location ~ ^/media-proxy/([^/]+)/(.+)$ {
  resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
  resolver_timeout 5s;

  set $upstream_host $1;
  set $upstream_path $2;

  proxy_pass https://$upstream_host/$upstream_path$is_args$args;
  proxy_ssl_server_name on;
  proxy_ssl_name $upstream_host;
  proxy_set_header Host $upstream_host;
  proxy_set_header User-Agent daone-media-proxy/1.0;
  proxy_hide_header Access-Control-Allow-Origin;

  add_header Access-Control-Allow-Origin * always;
  add_header Cache-Control "public, max-age=3600" always;
}
