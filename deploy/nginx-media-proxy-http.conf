# 放入 http { } 上下文（不可放进 server / location）
# 例：在 /etc/nginx/nginx.conf 的 http 块内 include，或写入 conf.d 外的独立片段由主配置引入。
#
# limit_req_zone / limit_conn_zone 供 deploy/nginx-media-proxy.conf 使用。

limit_req_zone $binary_remote_addr zone=daone_media_proxy:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=daone_media_proxy_conn:10m;
